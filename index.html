<!DOCTYPE html>
<html lang="ko" data-theme-auto="true">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>중3 과학 기말 대비 | 생식과 유전·에너지·별과 우주</title>
<meta name="description" content="중3 과학 기말고사 범위(생식과 유전, 에너지 전환과 보존, 별과 우주) 학습자료·플래시카드·퀴즈">
<link rel="stylesheet" href="assets/styles.css">
<script>
(function () {
  try {
    var t = localStorage.getItem('sc_theme');
    if (t === 'light' || t === 'dark') {
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.removeAttribute('data-theme-auto');
    }
  } catch (e) {}
})();
</script>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">⚛</span>
    <span class="brand-text">중3 과학 <b>기말 대비</b></span>
  </div>

  <nav class="tabs" id="tabbar" aria-label="주 메뉴">
    <button class="tab is-active" data-view="content" type="button">📚 학습자료</button>
    <button class="tab" data-view="cards" type="button">🃏 플래시카드</button>
    <button class="tab" data-view="quiz" type="button">📝 퀴즈</button>
    <button class="tab" data-view="results" type="button">📊 결과</button>
    <button class="tab" data-view="viz" type="button">🔬 시각화</button>
  </nav>

  <button id="btnTheme" class="btn btn-ghost theme-btn" type="button" aria-label="다크모드 전환">🌙 다크</button>
</header>

<main class="app-main">

  <!-- ========== 학습자료 ========== -->
  <section id="view-content" class="view is-active" aria-label="학습자료">
    <div class="content-layout">
      <aside class="toc-panel">
        <div class="toc-head">시험 범위</div>
        <nav id="toc" class="toc" aria-label="목차"></nav>
      </aside>
      <article class="doc-panel">
        <header class="doc-head">
          <div class="doc-crumb" id="contentCrumb"></div>
          <div class="doc-nav">
            <button id="btnPrevSection" class="btn btn-small" type="button">← 이전</button>
            <button id="btnNextSection" class="btn btn-small" type="button">다음 →</button>
          </div>
        </header>
        <div id="contentBody" class="doc-body md"></div>
        <footer class="doc-foot">
          <span id="contentHint">💡 목차에서 단원을 선택하세요. 시험 범위는 agent.md 기준입니다.</span>
        </footer>
      </article>
    </div>
  </section>

  <!-- ========== 플래시카드 ========== -->
  <section id="view-cards" class="view" aria-label="플래시카드">
    <div class="cards-toolbar">
      <div id="deckSelect" class="chip-row" role="tablist" aria-label="단원 선택"></div>
      <div class="cards-options">
        <label class="switch"><input type="checkbox" id="chkWeak"> <span>틀린 카드만</span></label>
        <label class="switch"><input type="checkbox" id="chkShuffle"> <span>섞기</span></label>
        <button id="btnRestartDeck" class="btn btn-small" type="button">처음부터</button>
      </div>
    </div>

    <div class="deck-progress">
      <div class="deck-progress-label">
        <span id="deckProgressText">—</span>
        <span id="deckProgressCounts" class="muted"></span>
      </div>
      <div class="bar"><div class="bar-fill" id="deckProgressBar" style="width:0%"></div></div>
    </div>

    <div class="card-stage" id="cardStage" tabindex="0" role="button" aria-label="카드 뒤집기">
      <div class="card-inner" id="cardInner">
        <div class="card-face card-front">
          <div class="card-tag" id="cardTag"></div>
          <div class="card-text" id="cardFront">카드를 불러오는 중…</div>
          <div class="card-hint">화면을 누르면 뒤집힙니다</div>
        </div>
        <div class="card-face card-back">
          <div class="card-tag tag-answer">정답</div>
          <div class="card-text" id="cardBack"></div>
        </div>
      </div>
    </div>

    <div class="card-controls">
      <span class="card-counter" id="cardCounter">—</span>
      <div class="rating-row">
        <button class="btn rating rating-unknown" id="btnUnknown" type="button">모른다</button>
        <button class="btn rating rating-maybe" id="btnMaybe" type="button">애매했다</button>
        <button class="btn rating rating-known" id="btnKnown" type="button">알았다</button>
      </div>
    </div>
    <p class="muted center" id="cardsSummary"></p>
  </section>

  <!-- ========== 퀴즈 ========== -->
  <section id="view-quiz" class="view" aria-label="퀴즈">
    <!-- 설정 -->
    <div id="quizSetup" class="quiz-setup">
      <h2>퀴즈 설정</h2>
      <div class="setup-block">
        <div class="setup-label">단원</div>
        <div id="unitChecks" class="chip-row check-row"></div>
      </div>
      <div class="setup-block">
        <div class="setup-label">문항 유형</div>
        <div id="typeChecks" class="chip-row check-row"></div>
      </div>
      <div class="setup-block">
        <div class="setup-label">문항 수</div>
        <div class="chip-row check-row" id="countChecks"></div>
      </div>
      <div class="setup-info muted" id="setupInfo"></div>
      <button id="btnStart" class="btn btn-primary btn-big" type="button">퀴즈 시작</button>
    </div>

    <!-- 진행 -->
    <div id="quizPlay" class="quiz-play is-hidden">
      <div class="quiz-top">
        <div class="quiz-progress" id="quizProgress">1 / 10</div>
        <div class="bar quiz-bar"><div class="bar-fill" id="quizBar" style="width:0%"></div></div>
        <button id="btnQuit" class="btn btn-small btn-ghost" type="button">나가기</button>
      </div>
      <div class="quiz-meta">
        <span class="badge" id="quizUnitBadge"></span>
        <span class="badge badge-type" id="quizTypeBadge"></span>
        <span class="badge badge-soft" id="quizSourceBadge"></span>
      </div>
      <div class="quiz-question" id="quizQuestion"></div>
      <div id="quizAnswerArea" class="quiz-answer-area"></div>
      <div id="quizFeedback" class="quiz-feedback is-hidden"></div>
      <div class="quiz-actions">
        <button id="btnGrade" class="btn btn-primary" type="button">채점</button>
        <button id="btnNext" class="btn btn-primary is-hidden" type="button">다음 문제 →</button>
      </div>
    </div>

    <!-- 종료 -->
    <div id="quizEnd" class="quiz-end is-hidden">
      <div class="score-ring">
        <svg viewBox="0 0 120 120" width="150" height="150" aria-hidden="true">
          <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
          <circle class="ring-fg" id="scoreRing" cx="60" cy="60" r="52"></circle>
        </svg>
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-cap">점</div>
      </div>
      <div class="end-summary" id="endSummary"></div>
      <div class="end-actions">
        <button id="btnRetry" class="btn btn-primary" type="button">다시 풀기</button>
        <button id="btnGoResults" class="btn" type="button">결과 분석 보기</button>
      </div>
    </div>
  </section>

  <!-- ========== 결과 ========== -->
  <section id="view-results" class="view" aria-label="결과 분석">
    <div id="resEmpty" class="empty-state is-hidden">
      <div class="empty-icon">📊</div>
      <p>아직 퀴즈 기록이 없습니다.<br>퀴즈를 풀면 여기에 결과가 쌓입니다.</p>
      <button class="btn btn-primary" data-goto="quiz" type="button">퀴즈 풀러 가기</button>
    </div>

    <div id="resBody" class="results is-hidden">
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-label">전체 정답률</div>
          <div class="stat-value" id="statOverall">—</div>
          <div class="stat-sub" id="statOverallSub"></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">응시 회차</div>
          <div class="stat-value" id="statAttempts">0</div>
          <div class="stat-sub" id="statAttemptsSub"></div>
        </div>
        <div class="stat-card stat-alert" id="weakCard">
          <div class="stat-label">취약 단원</div>
          <div class="stat-value stat-value-sm" id="statWeak">—</div>
          <div class="stat-sub" id="statWeakSub"></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">플래시카드</div>
          <div class="stat-value" id="statCards">—</div>
          <div class="stat-sub" id="statCardsSub"></div>
        </div>
      </div>

      <section class="panel">
        <h3>단원별 정답률</h3>
        <div id="resUnits" class="unit-bars"></div>
      </section>

      <section class="panel">
        <h3>회차별 점수 추이</h3>
        <div id="resTrend" class="trend"></div>
      </section>

      <section class="panel">
        <h3>틀린 문제 확인 <span class="muted" id="wrongCount"></span></h3>
        <div id="resWrong" class="wrong-list"></div>
      </section>

      <section class="panel">
        <h3>자주 틀린 개념 <span class="muted">(플래시카드 기록)</span></h3>
        <div id="resWeakCards" class="wrong-list"></div>
      </section>

      <div class="reset-row">
        <button id="btnResetQuiz" class="btn btn-danger-ghost" type="button">퀴즈 기록 초기화</button>
        <button id="btnResetCards" class="btn btn-danger-ghost" type="button">플래시카드 기록 초기화</button>
      </div>
    </div>
  </section>

  <!-- ========== 시각화 ========== -->
  <section id="view-viz" class="view" aria-label="시각화">
    <div id="vizList" class="chip-row viz-list"></div>
    <div class="viz-frame">
      <div class="viz-head">
        <h3 id="vizTitle">—</h3>
        <p id="vizDesc" class="muted"></p>
      </div>
      <div id="vizStage" class="viz-stage"></div>
      <div id="vizNote" class="viz-note"></div>
    </div>
  </section>

</main>

<footer class="app-footer">
  <span id="footerInfo"></span>
  <span class="muted">범위 기준: agent.md · 자료 기준: content.md</span>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script src="assets/viz.js"></script>
</body>
</html>
